<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7b72"/></marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2a8ff"/></marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <style>
      .t { fill:#e6edf3; font-size:14px; font-weight:600; }
      .s { fill:#8b949e; font-size:12px; }
      .m { fill:#c9d1d9; font-size:11.5px; font-family:Consolas, Menlo, monospace; }
      .gt { fill:#8b949e; font-size:12px; font-weight:700; letter-spacing:1.5px; }
      .box { fill:#161b22; stroke:#30363d; stroke-width:1; }
      .grp { fill:#0f141a; stroke:#262c36; stroke-width:1; }
      .chip { fill:#1c2330; stroke:#30363d; }
      .badge { fill:#0d1117; stroke-width:1.5; }
      .bn { font-size:11px; font-weight:700; text-anchor:middle; }
      .lbl { fill:#8b949e; font-size:11px; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#0d1117"/>

  <text x="30" y="50" fill="#e6edf3" font-size="26" font-weight="700">Nexus Core — Architecture</text>
  <text x="30" y="76" class="s" font-size="14">Signed requests over Redis Streams · multi-level cache (L1 Caffeine → L2 Redis → DataStore) · responses over Pub/Sub</text>

  <!-- Column A: clients -->
  <rect x="30" y="110" width="230" height="300" rx="10" class="grp"/>
  <text x="46" y="134" class="gt">CLIENTS</text>
  <rect x="46" y="150" width="198" height="110" rx="8" class="box"/>
  <rect x="46" y="150" width="4" height="110" rx="2" fill="#58a6ff"/>
  <text x="62" y="176" class="t">Game servers</text>
  <text x="62" y="196" class="s">Server plugins / services</text>
  <text x="62" y="220" class="m">MessageAuth.stamp()</text>
  <text x="62" y="238" class="m">→ XADD payload</text>
  <rect x="46" y="275" width="198" height="120" rx="8" class="box"/>
  <rect x="46" y="275" width="4" height="120" rx="2" fill="#58a6ff"/>
  <text x="62" y="300" class="t">Request envelope</text>
  <text x="62" y="322" class="m">protocol · source</text>
  <text x="62" y="340" class="m">type · data</text>
  <text x="62" y="358" class="m">timestamp · nonce</text>
  <text x="62" y="376" class="m">sig (HMAC-SHA256)</text>

  <!-- Legend -->
  <rect x="30" y="430" width="230" height="310" rx="10" class="grp"/>
  <text x="46" y="456" class="gt">REQUEST PATH</text>
  <g class="s">
    <circle cx="56" cy="482" r="10" class="badge" stroke="#58a6ff"/><text x="56" y="486" class="bn" fill="#58a6ff">1</text>
    <text x="74" y="486">Client XADDs signed request</text>
    <circle cx="56" cy="514" r="10" class="badge" stroke="#ff7b72"/><text x="56" y="518" class="bn" fill="#ff7b72">2</text>
    <text x="74" y="518">Worker reads via group</text>
    <circle cx="56" cy="546" r="10" class="badge" stroke="#d2a8ff"/><text x="56" y="550" class="bn" fill="#d2a8ff">3</text>
    <text x="74" y="550">Signature · time · nonce</text>
    <circle cx="56" cy="578" r="10" class="badge" stroke="#58a6ff"/><text x="56" y="582" class="bn" fill="#58a6ff">4</text>
    <text x="74" y="582">Route by protocol id</text>
    <circle cx="56" cy="610" r="10" class="badge" stroke="#58a6ff"/><text x="56" y="614" class="bn" fill="#58a6ff">5</text>
    <text x="74" y="614">Handler for request type</text>
    <circle cx="56" cy="642" r="10" class="badge" stroke="#3fb950"/><text x="56" y="646" class="bn" fill="#3fb950">6</text>
    <text x="74" y="646">Read/write L1 → L2 → DB</text>
    <circle cx="56" cy="674" r="10" class="badge" stroke="#ff7b72"/><text x="56" y="678" class="bn" fill="#ff7b72">7</text>
    <text x="74" y="678">Reply on Pub/Sub</text>
    <circle cx="56" cy="706" r="10" class="badge" stroke="#e3b341"/><text x="56" y="710" class="bn" fill="#e3b341">8</text>
    <text x="74" y="710">Flush dirty keys, then XACK</text>
  </g>

  <!-- Operators -->
  <rect x="30" y="770" width="230" height="130" rx="10" class="grp"/>
  <text x="46" y="794" class="gt">OPERATORS</text>
  <rect x="46" y="808" width="198" height="62" rx="8" class="box"/>
  <rect x="46" y="808" width="4" height="62" rx="2" fill="#39c5cf"/>
  <text x="62" y="832" class="t">Admin · browser</text>
  <text x="62" y="852" class="s">session login (BCrypt hash)</text>

  <!-- Column B: Redis -->
  <rect x="300" y="110" width="300" height="660" rx="10" class="grp"/>
  <text x="316" y="134" class="gt" fill="#ff7b72">REDIS 7+</text>

  <rect x="316" y="150" width="268" height="100" rx="8" class="box"/>
  <rect x="316" y="150" width="4" height="100" rx="2" fill="#ff7b72"/>
  <text x="332" y="174" class="t">Request stream</text>
  <text x="332" y="196" class="m">darkland_nexus_stream</text>
  <text x="332" y="214" class="s">group nexus-core-group</text>
  <text x="332" y="232" class="s">field payload · PEL redelivery</text>

  <rect x="316" y="264" width="268" height="72" rx="8" class="box"/>
  <rect x="316" y="264" width="4" height="72" rx="2" fill="#ff7b72"/>
  <text x="332" y="288" class="t">Delivery receipts</text>
  <text x="332" y="308" class="m">…_delivery_receipts</text>
  <text x="332" y="325" class="s">validated: / done: markers</text>

  <rect x="316" y="350" width="268" height="100" rx="8" class="box"/>
  <rect x="316" y="350" width="4" height="100" rx="2" fill="#3fb950"/>
  <text x="332" y="374" class="t">L2 cache</text>
  <text x="332" y="396" class="m">&lt;keyTag&gt;_&lt;id&gt; → JSON</text>
  <text x="332" y="414" class="s">per-addon TTL (getCacheTTL)</text>
  <text x="332" y="432" class="s">L1 sync task restores lost keys</text>

  <rect x="316" y="464" width="268" height="84" rx="8" class="box"/>
  <rect x="316" y="464" width="4" height="84" rx="2" fill="#ff7b72"/>
  <text x="332" y="488" class="t">Response channel</text>
  <text x="332" y="510" class="m">darkland_nexus_&lt;source&gt;</text>
  <text x="332" y="530" class="s">signed · not durable</text>

  <rect x="316" y="562" width="268" height="84" rx="8" class="box"/>
  <rect x="316" y="562" width="4" height="84" rx="2" fill="#3fb950"/>
  <text x="332" y="586" class="t">L1 invalidation bus</text>
  <text x="332" y="608" class="m">darkland_nexus_l1invalidate</text>
  <text x="332" y="628" class="s">only with NEXUS_CLUSTER_MODE</text>

  <rect x="316" y="660" width="268" height="94" rx="8" class="box"/>
  <rect x="316" y="660" width="4" height="94" rx="2" fill="#3fb950"/>
  <text x="332" y="684" class="t">Keyspace events</text>
  <text x="332" y="706" class="m">__keyevent@0__:expired</text>
  <text x="332" y="726" class="s">expired L2 key → drop from L1</text>

  <!-- Column C: Nexus Core -->
  <rect x="640" y="110" width="640" height="660" rx="10" class="grp"/>
  <text x="656" y="134" class="gt" fill="#58a6ff">NEXUS CORE · JDK 26</text>
  <text x="1264" y="134" class="s" text-anchor="end">NexusApplication wires and starts everything</text>

  <rect x="656" y="150" width="294" height="140" rx="8" class="box"/>
  <rect x="656" y="150" width="4" height="140" rx="2" fill="#ff7b72"/>
  <text x="672" y="174" class="t">RedisManager</text>
  <text x="672" y="196" class="m">XREADGROUP consumer</text>
  <text x="672" y="214" class="m">XAUTOCLAIM sweeper</text>
  <text x="672" y="234" class="s">1 inbound worker per CPU core</text>
  <text x="672" y="252" class="s">RequestExecution (ScopedValue)</text>
  <text x="672" y="270" class="s">virtual-thread executors</text>

  <rect x="970" y="150" width="294" height="140" rx="8" class="box"/>
  <rect x="970" y="150" width="4" height="140" rx="2" fill="#d2a8ff"/>
  <text x="986" y="174" class="t">MessageValidationChain</text>
  <text x="986" y="198" class="m">SignatureValidator</text>
  <text x="986" y="214" class="s">HMAC-SHA256 · NEXUS_SIGNING_KEY</text>
  <text x="986" y="236" class="m">TimestampValidator</text>
  <text x="986" y="252" class="s">5-minute window</text>
  <text x="986" y="274" class="m">NonceValidator <tspan class="s">· replay guard</tspan></text>

  <rect x="656" y="320" width="294" height="150" rx="8" class="box"/>
  <rect x="656" y="320" width="4" height="150" rx="2" fill="#58a6ff"/>
  <text x="672" y="344" class="t">NexusReceiver</text>
  <text x="672" y="364" class="s">parses type · protocol · source</text>
  <text x="672" y="382" class="s">LOAD_CACHE handled directly</text>
  <text x="672" y="408" class="t">ProtocolHandler</text>
  <text x="672" y="428" class="s">addon registry by protocol id</text>
  <text x="672" y="446" class="s">duplicate ids rejected</text>

  <rect x="970" y="320" width="294" height="150" rx="8" class="box"/>
  <rect x="970" y="320" width="4" height="150" rx="2" fill="#58a6ff"/>
  <text x="986" y="344" class="t">DataAddon</text>
  <text x="986" y="364" class="s">schema · keyTag · TTL · L1 on/off</text>
  <text x="986" y="382" class="s">extra validation chain · key locks</text>
  <text x="986" y="408" class="m">Java addon <tspan class="s">addons/*.jar</tspan></text>
  <text x="986" y="428" class="m">JsonModelAddon <tspan class="s">models/*.json</tspan></text>
  <text x="986" y="448" class="s">ModelDefinitionLoader → parser</text>

  <text x="656" y="500" class="gt" font-size="11">REQUEST HANDLERS</text>
  <g font-family="Consolas, Menlo, monospace" font-size="10" fill="#c9d1d9" text-anchor="middle">
    <rect x="656" y="510" width="96" height="40" rx="6" class="chip"/><text x="704" y="534">GET_DATA</text>
    <rect x="757" y="510" width="96" height="40" rx="6" class="chip"/><text x="805" y="534">SET_DATA</text>
    <rect x="858" y="510" width="96" height="40" rx="6" class="chip"/><text x="906" y="534">INCREMENT_DATA</text>
    <rect x="959" y="510" width="96" height="40" rx="6" class="chip"/><text x="1007" y="534">REMOVE_DATA</text>
    <rect x="1060" y="510" width="96" height="40" rx="6" class="chip"/><text x="1108" y="534">RANKING</text>
    <rect x="1161" y="510" width="103" height="40" rx="6" class="chip"/><text x="1212" y="534">RANK_FINDER</text>
  </g>

  <rect x="656" y="580" width="294" height="160" rx="8" class="box"/>
  <rect x="656" y="580" width="4" height="160" rx="2" fill="#3fb950"/>
  <text x="672" y="604" class="t">RedisDataContainer</text>
  <text x="672" y="626" class="m">L1 · Caffeine</text>
  <text x="672" y="644" class="s">100k entries, per-addon expiry</text>
  <text x="672" y="666" class="m">pending writes</text>
  <text x="672" y="684" class="s">dirty-key snapshots survive eviction</text>
  <text x="672" y="706" class="m">flushKey()</text>
  <text x="672" y="724" class="s">runs before the stream ACK</text>

  <rect x="970" y="580" width="294" height="160" rx="8" class="box"/>
  <rect x="970" y="580" width="4" height="160" rx="2" fill="#e3b341"/>
  <text x="986" y="604" class="t">DataStore</text>
  <text x="986" y="626" class="s">DataStoreFactory picks by dbType</text>
  <text x="986" y="650" class="m">MongoRepository</text>
  <text x="986" y="668" class="m">SqlRepository + SqlDialect</text>
  <text x="986" y="688" class="s">HikariCP pools for SQL engines</text>
  <text x="986" y="710" class="m">ResilienceExecutor</text>
  <text x="986" y="728" class="s">wraps Redis and database calls</text>

  <!-- Column D -->
  <rect x="1320" y="110" width="250" height="480" rx="10" class="grp"/>
  <text x="1336" y="134" class="gt" fill="#e3b341">DURABLE STORAGE</text>
  <text x="1336" y="154" class="s">exactly one engine, via dbType</text>
  <rect x="1336" y="170" width="218" height="56" rx="8" class="box"/><circle cx="1358" cy="198" r="7" fill="#3fb950"/><text x="1376" y="203" class="t">MongoDB</text>
  <rect x="1336" y="236" width="218" height="56" rx="8" class="box"/><circle cx="1358" cy="264" r="7" fill="#4479a1"/><text x="1376" y="269" class="t">MySQL</text>
  <rect x="1336" y="302" width="218" height="56" rx="8" class="box"/><circle cx="1358" cy="330" r="7" fill="#c49a6c"/><text x="1376" y="335" class="t">MariaDB</text>
  <rect x="1336" y="368" width="218" height="56" rx="8" class="box"/><circle cx="1358" cy="396" r="7" fill="#6e9fd8"/><text x="1376" y="401" class="t">PostgreSQL</text>
  <rect x="1336" y="434" width="218" height="56" rx="8" class="box"/><circle cx="1358" cy="462" r="7" fill="#e05a47"/><text x="1376" y="467" class="t">MS SQL Server</text>
  <rect x="1336" y="500" width="218" height="56" rx="8" class="box"/><circle cx="1358" cy="528" r="7" fill="#8bb8e8"/><text x="1376" y="533" class="t">SQLite <tspan class="s">· single file</tspan></text>

  <rect x="1320" y="610" width="250" height="130" rx="10" class="grp"/>
  <text x="1336" y="634" class="gt" fill="#d2a8ff">OBSERVABILITY</text>
  <rect x="1336" y="648" width="218" height="78" rx="8" class="box"/>
  <rect x="1336" y="648" width="4" height="78" rx="2" fill="#d2a8ff"/>
  <text x="1352" y="672" class="t">InfluxDB <tspan class="s">(optional)</tspan></text>
  <text x="1352" y="692" class="s">metricsEnabled = true</text>
  <text x="1352" y="710" class="m">@NexusMetric fields</text>

  <!-- Bottom row -->
  <rect x="300" y="790" width="1270" height="110" rx="10" class="grp"/>
  <text x="316" y="814" class="gt" fill="#39c5cf">WEB · SETUP · METRICS</text>
  <text x="316" y="842" class="s">SetupWizard (terminal, first launch)</text>
  <text x="316" y="860" class="s">writes config.json: Redis, dbType,</text>
  <text x="316" y="878" class="s">web port, admin credentials</text>
  <rect x="656" y="805" width="294" height="80" rx="8" class="box"/>
  <rect x="656" y="805" width="4" height="80" rx="2" fill="#39c5cf"/>
  <text x="672" y="829" class="t">Web dashboard <tspan class="s">· Spring Boot :8088</tspan></text>
  <text x="672" y="851" class="m">/api/stats  /api/addons</text>
  <text x="672" y="869" class="m">/api/cache-metrics  /api/keys</text>
  <rect x="970" y="805" width="294" height="80" rx="8" class="box"/>
  <rect x="970" y="805" width="4" height="80" rx="2" fill="#d2a8ff"/>
  <text x="986" y="829" class="t">CacheMetrics · InfluxDBManager</text>
  <text x="986" y="851" class="s">L1 / L2 / L3 hit counters per addon</text>
  <text x="986" y="869" class="s">addon metric fields → Influx points</text>

  <!-- Edges -->
  <g fill="none" stroke-width="1.6">
    <path d="M244 205 H312" stroke="#58a6ff" marker-end="url(#arrBlue)"/>
    <path d="M584 200 H652" stroke="#ff7b72" marker-end="url(#arrRed)"/>
    <path d="M950 220 H966" stroke="#d2a8ff" marker-end="url(#arrPurple)"/>
    <path d="M1117 290 V305 H803 V316" stroke="#58a6ff" marker-end="url(#arrBlue)"/>
    <path d="M950 395 H966" stroke="#58a6ff" marker-end="url(#arrBlue)"/>
    <path d="M1117 470 V506" stroke="#58a6ff" marker-end="url(#arrBlue)"/>
    <path d="M803 550 V576" stroke="#3fb950" marker-end="url(#arrGreen)"/>
    <path d="M656 620 H645 V400 H588" stroke="#3fb950" marker-end="url(#arrGreen)" marker-start="url(#arrGreen)"/>
    <path d="M950 660 H966" stroke="#e3b341" marker-end="url(#arrAmber)"/>
    <path d="M1264 660 H1296 V363 H1332" stroke="#e3b341" marker-end="url(#arrAmber)"/>
    <path d="M656 530 H630 V506 H588" stroke="#ff7b72" marker-end="url(#arrRed)"/>
    <path d="M316 506 H280 V232 H248" stroke="#ff7b72" marker-end="url(#arrRed)"/>
    <path d="M656 270 H620 V300 H588" stroke="#ff7b72" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
    <path d="M656 690 H612 V604 H588" stroke="#3fb950" stroke-dasharray="5 4" marker-end="url(#arrGreen)" marker-start="url(#arrGreen)"/>
    <path d="M584 720 H635 V730 H652" stroke="#3fb950" stroke-dasharray="5 4" marker-end="url(#arrGreen)"/>
    <path d="M1264 845 H1300 V690 H1332" stroke="#d2a8ff" stroke-dasharray="5 4" marker-end="url(#arrPurple)"/>
    <path d="M244 839 H280 V780 H630 V845 H652" stroke="#39c5cf" marker-end="url(#arrCyan)"/>
  </g>

  <!-- Labels and step badges -->
  <text x="268" y="194" class="lbl" text-anchor="middle">XADD</text>
  <circle cx="294" cy="205" r="9" class="badge" stroke="#58a6ff"/><text x="294" y="209" class="bn" fill="#58a6ff">1</text>
  <circle cx="618" cy="200" r="9" class="badge" stroke="#ff7b72"/><text x="618" y="204" class="bn" fill="#ff7b72">2</text>
  <circle cx="958" cy="202" r="9" class="badge" stroke="#d2a8ff"/><text x="958" y="206" class="bn" fill="#d2a8ff">3</text>
  <circle cx="960" cy="305" r="9" class="badge" stroke="#58a6ff"/><text x="960" y="309" class="bn" fill="#58a6ff">4</text>
  <circle cx="1131" cy="490" r="9" class="badge" stroke="#58a6ff"/><text x="1131" y="494" class="bn" fill="#58a6ff">5</text>
  <circle cx="817" cy="563" r="9" class="badge" stroke="#3fb950"/><text x="817" y="567" class="bn" fill="#3fb950">6</text>
  <circle cx="617" cy="518" r="9" class="badge" stroke="#ff7b72"/><text x="617" y="522" class="bn" fill="#ff7b72">7</text>
  <circle cx="958" cy="644" r="9" class="badge" stroke="#e3b341"/><text x="958" y="648" class="bn" fill="#e3b341">8</text>
  <text x="620" y="262" class="lbl" font-size="9" text-anchor="middle">ACK</text>
  <text x="626" y="392" class="lbl" text-anchor="middle">L2</text>
  <text x="1296" y="354" class="lbl" text-anchor="middle">persist</text>
  <text x="300" y="498" class="lbl" text-anchor="middle">reply</text>
</svg>